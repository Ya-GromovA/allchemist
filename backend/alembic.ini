# Alembic configuration for the Allchemist backend.
#
# The database URL is intentionally NOT stored here. It is resolved at runtime
# by alembic/env.py from the application settings
# (app.core.config.resolve_database_url), or from the ALEMBIC_DATABASE_URL
# environment variable when a migration has to be verified against a throwaway
# database. This file must never contain credentials.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# <sequence>_<date>_<slug>.py -- revisions sort by sequence number and carry
# their authoring date, so parallel branches are visible at a glance.
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(slug)s

timezone = UTC
truncate_slug_length = 60

# Resolved in env.py. Leave empty.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
