[pytest]
# Run the suite from backend/ with no environment prefix:
#   cd /root/synapse/backend && ./.venv-test/bin/pytest
# `pythonpath = .` makes `import app` work without PYTHONPATH, and the database
# connection now comes from backend/.env -> ../infra/.env (the single source of
# truth for connection parameters), so the host suite and the container talk to
# the same database with the same credentials.
testpaths = tests
pythonpath = .
