name: Production Release Gate

# Гейт остаётся ручным: выпуск в production запускает человек и подтверждает
# внешние блокеры. Но раньше workflow не запускался вообще ничем, кроме
# workflow_dispatch, поэтому его шаги проверялись только в день релиза.
# Теперь те же шаги прогоняются на любой ветке и на pull request, когда меняется
# то, что этот гейт проверяет. Ожидаемая версия APK при этом не задаётся —
# метаданные проверяются на внутреннюю согласованность.
on:
  workflow_dispatch:
    inputs:
      apk_version:
        description: Expected latest APK versionName, for example 1.0.11
        required: true
        type: string
      confirm_provider_blockers:
        description: Confirm external blockers are tracked outside CI
        required: true
        type: boolean
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/production-release-gate.yml'
      - 'content_packs/allchemist-apk-latest.json'
      - 'backend/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/production-release-gate.yml'
      - 'content_packs/allchemist-apk-latest.json'
      - 'backend/**'
      - 'tools/**'

concurrency:
  group: allchemist-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Metadata and regression gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_provider_blockers }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: synapse
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse_ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify latest APK metadata file
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('content_packs/allchemist-apk-latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          expected = os.environ.get('EXPECTED_APK_VERSION', '').strip()
          if expected and data.get('versionName') != expected:
              raise SystemExit(f"versionName mismatch: {data.get('versionName')} != {expected}")
          for key in ['versionName', 'versionCode', 'apkFile', 'sha256', 'size']:
              if not data.get(key):
                  raise SystemExit(f'missing metadata key: {key}')
          # The APK binary itself is 106 MiB and deliberately gitignored
          # (.gitignore: *.apk), so a CI checkout never contains it. Demanding
          # its presence made this step fail on every run -- a gate that cannot
          # pass. The metadata is always checked; the binary is checked only
          # where it actually exists, which is the release host.
          apk = path.parent / data['apkFile']
          if apk.exists():
              if apk.stat().st_size != int(data['size']):
                  raise SystemExit(
                      f"APK size mismatch: {apk.stat().st_size} != {data['size']}"
                  )
              print(f'APK artifact present and size matches: {apk}')
          else:
              print(
                  f'APK artifact not in this checkout ({apk}); binaries are '
                  'gitignored. Verified metadata only -- verify the artifact '
                  'itself on the release host with tools/db-free release checks.'
              )
          if expected:
              print(f"APK metadata OK for expected version {expected}")
          else:
              print(f"APK metadata self-consistent for version {data['versionName']}")
          PY
        env:
          EXPECTED_APK_VERSION: ${{ inputs.apk_version }}
      - name: Run release regression
        working-directory: backend
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5433'
          POSTGRES_DB: synapse
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse_ci_password
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          # Same reason as in ci.yml: the access matrix is database-backed.
          alembic upgrade head
          pytest tests/test_auth_sync_contract.py tests/test_public_web.py tests/test_content_quality_snapshot.py tests/test_redaction.py
      # Release must not ship an image that cannot migrate the database it will
      # meet. See the 2026-08-14 incident: image at 0001, database at 0004, any
      # restart -> 502. Chain integrity plus repo-to-image coverage are the two
      # halves that would have caught it before release.
      - name: Gate on migration coverage
        run: |
          tools/db/check_migration_coverage.sh --chain backend/alembic/versions
          docker build -t allchemist-backend:release-gate -f backend/Dockerfile backend/
          tools/db/check_migration_coverage.sh \
            --repo backend/alembic/versions --image-ref allchemist-backend:release-gate
      - name: Check web syntax and ops scripts
        run: |
          node --check backend/app/web_public/app.js
          node --check backend/app/web_admin/app.js
          bash -n tools/backup_synapse.sh tools/stage11-production-preflight.sh tools/stage15-production-hardening-check.sh
          python -m py_compile tools/revoke_sessions.py
      - name: Verify source encoding
        run: node tools/verify-source-encoding.mjs
